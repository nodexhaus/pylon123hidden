name: Rebuild Pylon

on:
  schedule:
    - cron: "7 13 * * *"            # 9:07 AM Eastern every day
    - cron: "37 14-22/2 * * 0,1,4"  # Thu, Sun, Mon: every 2 hours, 10:37 AM to 6:37 PM Eastern
    - cron: "23 15 * * 0"           # Sunday 11:23 AM Eastern, before the early games
  workflow_dispatch: {}   # "Run workflow" button for a manual rebuild

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Past seasons never change, so keep them between runs
      - uses: actions/cache@v4
        with:
          path: data
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      - run: python pylon_build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
